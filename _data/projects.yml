- id: uav-ugv
  title: Optimal Rendezvous Trajectory for Unmanned Aerial-Ground Vehicles
  affiliation: Department of Electrical Engineering, IIT Madras
  supervisor: Prof. Rachel Kalpana Kalaimani
  date: Mar 2025 – May 2025
  description: "Formulated an optimal control framework for autonomous UAV–UGV rendezvous and in-motion docking under nonlinear dynamics. Designed an aggressiveness-index-based trajectory tracking strategy in PRONTO, providing tunable rendezvous behaviors with verified numerical convergence."
