- id: bolt
  title: BOLT — Driverless Institute Shuttle
  affiliation: Team Abhiyaan, IIT Madras
  supervisor: Prof. Sathyan Subbiah
  date: Jul 2024 – May 2025
  team_context: abhiyaan
  description:
    - Developed and fully deployed a ROS-based autonomy stack on an electric golf cart, turning it into a driverless institute shuttle.
    - Achieved 98.3% accuracy using 3D LiDAR–camera sensor fusion for object classification and distance estimation.
    - Leveraged realistic CARLA and Gazebo simulations to comprehensively test the software subsystem for BOLT.
    - Integrated the autonomous software modules to achieve reliable end-to-end operation of the shuttle.
  tags:
    - ROS2
