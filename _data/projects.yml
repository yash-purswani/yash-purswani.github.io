- id: uav-ugv
  title: Optimal Rendezvous Trajectory for Unmanned Aerial-Ground Vehicles
  affiliation: Department of Electrical Engineering, IIT Madras
  supervisor: Prof. Rachel Kalpana Kalaimani
  date: Mar 2025 – May 2025
  description:
    - Designed an optimal control framework for UAV–UGV rendezvous and in-motion refuelling under non-linear dynamics.
    - Developed a trajectory-tracking and aggressiveness-index-based control strategy enabling tunable rendezvous behaviour.
    - Validated the method through numerical simulations in PRONTO, demonstrating robust convergence and adaptability.
  tags:
