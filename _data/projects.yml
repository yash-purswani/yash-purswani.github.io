- id: ardc
  title: Autonomous Road Dust Collector
  affiliation: Department of Civil Engineering, IIT Madras
  supervisor: Prof. Sivanagendra SM
  date: Nov 2025 – Mar 2026
  description:
    - Developed an autonomous road dust collection robot for unmanned operation in sub-urban environments.
    - Implemented 3D LiDAR-based odometry and mapping using FAST-LIO2, with NDT-based localisation for pose estimation.
    - Incorporated Lanelet-based semantic road modelling for path planning and context-aware autonomous navigation.
    - Performed system performance evaluation and failure-mode analysis using time-series sensor data and simulation logs.
  tags:
    - Autonomous Navigation
    - LiDAR
    - FAST-LIO2
    - NDT Localisation
    - Lanelets
    - ROS2
