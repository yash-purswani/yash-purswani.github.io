- id: 3d-reconstruction
  title: MLOps Pipeline for 3D Scene Reconstruction
  affiliation: Department of Data Science and Artificial Intelligence (DSAI), IIT Madras
  supervisor: Dr. Sudarsun Santhiappan
  date: Mar 2026 – May 2026
  description: "Built an automated end-to-end MLOps pipeline orchestrating distributed 3D reconstruction and dense point cloud generation. Containerized multi-stage Structure-from-Motion workflows using Docker, integrating automated data versioning, experiment tracking, and artifact pipelines for reproducible multi-node deployment."
