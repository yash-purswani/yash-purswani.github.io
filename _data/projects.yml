- id: ardc
  title: Autonomous Road Dust Collector
  affiliation: Department of Civil Engineering, IIT Madras
  supervisor: Prof. Sivanagendra SM
  date: Nov 2025 – Mar 2026
  description: "Developed an autonomous road dust collection robot for unmanned operation in suburban environments. Engineered the navigation stack using FAST-LIO2 for 3D LiDAR odometry and mapping, NDT-based localization for pose estimation, and Lanelet semantic maps for context-aware path planning."
