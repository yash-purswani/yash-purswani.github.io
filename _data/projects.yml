- id: 3d-reconstruction
  title: MLOps Pipeline for 3D Scene Reconstruction
  affiliation: Department of Data Science and Artificial Intelligence (DSAI), IIT Madras
  supervisor: Dr. Sudarsun Santhiappan
  date: Mar 2026 – May 2026
  description:
    - Built an automated MLOps pipeline orchestrating distributed 3D reconstruction and dense point cloud generation workflows.
    - Containerised multi-stage structure-from-motion workflows using Docker to ensure reproducible, isolated and scalable deployment.
    - Integrated automated data versioning, experiment tracking and artifact pipelines across all reconstruction execution stages.
    - Benchmarked inference throughput and optimised resource utilisation across heterogeneous computing environments.
  tags:
