- id: stuttgart-thesis
  title: Synthetic Database Creation and Active Viewpoint Selection for Zebra Re-Identification
  context: Uncertainty-guided active perception and UV texture completion for 3D animal reconstruction.
  affiliation: Institute of Flight Mechanics and Control (IFR), Universität Stuttgart
  role: Master's Thesis · DAAD KOSPIE Scholar
  supervisor: Prof. Aamir Ahmad
  date: Sep 2026 – Mar 2027
  description: "Investigating synthetic database creation from 2D zebra image datasets to facilitate accurate animal re-identification. The thesis addresses core challenges in multi-view UV texture mapping, representing uncertainty across the UV texture map, and learning active viewpoint policies (single- and multi-agent) that dynamically query database views based on texture uncertainty to complete the full 3D animal reconstruction."
  tags:
    - Active Perception
    - 3D Reconstruction
    - UV Texture Mapping
    - Multi-Agent Systems
    - Reinforcement Learning
    - Animal Re-Identification
    - Synthetic Data
  image: /assets/img/projects/synth_reid.jpg
  video:
  alt: Synthetic UV texture mapping and uncertainty-guided active viewpoint planning for zebra 3D reconstruction.
