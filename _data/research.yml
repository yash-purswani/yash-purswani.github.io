- id: eth-adversarial
  title: Rule-Constrained Adversarial Scenario Generation
  affiliation: Institute for Dynamic Systems and Control (IDSC), ETH Zürich
  role: RobotX 2026 Fellow
  supervisor: Prof. Emilio Frazzoli
  date: Jul 2026 – Aug 2026
  description: "Developed a feasibility-aware reinforcement learning framework for autonomous-vehicle safety validation. By constraining non-ego agent behaviors through feasibility learning, the framework generates realistic, safety-critical adversarial scenarios while significantly curbing unrealistic traffic-rule violations."
  tags:
    - Reinforcement Learning
    - Autonomous Vehicles
    - Adversarial Scenario Generation
    - Safety Validation
    - Feasibility Learning
