- id: swarm-control
  title: Finite-Time Centroid Tracking and Exponential Formation Stabilization in Arbitrary Swarm Configurations
  affiliation: Distributed Intelligence & Robotics Lab (DIRo Lab), Department of Mechanical Engineering, IIT Madras
  role: Research Project
  supervisor: Prof. Anuj Kumar Tiwari
  date: Sep 2025 – Sep 2026
  description: "Formulated a hybrid distributed control framework for multi-robot swarms that decouples centroid tracking from formation geometry. Derived analytical proofs for global exponential formation convergence and Input-to-State Stability (ISS) under bounded disturbances via finite-time sliding-mode control."
  tags:
    - Multi-Robot Systems
    - Distributed Control
    - Finite-Time Control
    - Formation Control
